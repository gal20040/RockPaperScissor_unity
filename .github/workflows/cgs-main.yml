            exit 1
          fi
          #
          archive_name="${{ env.VERSIONnMODE }}.gh_ws_r8_gradle_stage.7z"
          compress_7z "$REPORTS_DIR" "$archive_name" 9
          time aws s3 cp "$archive_name" "s3://$R2_BUCKET/${{ env.VERSIONnMODE }}/$archive_name" --endpoint-url $R2_ENDPOINT --quiet

      - name: Check ${{ env.GH_WS_R8PATH }}
        continue-on-error: true
        timeout-minutes: 1
        if: always() && steps.run_R8_configuration_analyzer.outcome != 'skipped'
        run: |
          source .github/scripts/helpers.sh
          check_folder ${{ env.GH_WS_R8PATH }}

      - name: 🗜️ Upload R8 Configuration Analyzer Report (gradle stage)
        continue-on-error: true
        timeout-minutes: 1
        if: always() && steps.run_R8_configuration_analyzer.outcome != 'skipped'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          REPORTS_DIR="${{ env.TMP_R8_ANALYSIS_PATH }}"
          if [ ! -d "$REPORTS_DIR" ]; then
            echo "'$REPORTS_DIR' folder not found, skipping uploading it to R2."
            exit 1
          fi
          #
          source .github/scripts/helpers.sh
          check_folder $REPORTS_DIR
          #
          nonZeroFiles=$(find $REPORTS_DIR -type f -size +0 | wc -l)
          if [ "$nonZeroFiles" -le 0 ]; then
            echo "'$REPORTS_DIR' folder is empty, skipping uploading it to R2."
            exit 1
          fi
          #
          archive_name="${{ env.VERSIONnMODE }}.tmp_r8_gradle_stage.7z"
          compress_7z "$REPORTS_DIR" "$archive_name" 9
          time aws s3 cp "$archive_name" "s3://$R2_BUCKET/${{ env.VERSIONnMODE }}/$archive_name" --endpoint-url $R2_ENDPOINT --quiet

      - name: 🗜️ Find and upload r8.json
        continue-on-error: true
        timeout-minutes: 1
        if: always() && steps.run_R8_configuration_analyzer.outcome != 'skipped'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          DIR="${{ github.workspace }}"
          #
          if [ ! -d "$DIR" ]; then
            echo "'$DIR' folder not found, skipping uploading it to R2."
            exit 1
          fi
          #
          source .github/scripts/helpers.sh
          #
          echo "=== 'r8.json' files in '$DIR' ==="
          find $DIR -type f \( -iname "*r8.json*" \) 2>/dev/null
          echo "================================="
          #
          archive_name="r8.json_in_gh_ws.zip"
          find $DIR -type f \( -iname "*r8.json*" \) | zip $archive_name -@
          #
          time aws s3 cp "$archive_name" "s3://$R2_BUCKET/${{ env.VERSIONnMODE }}/$archive_name" --endpoint-url $R2_ENDPOINT --quiet

